  api-tec-challenge: 
    container_name: api-tec-challenge-game
    build: .
    environment:
        ASPNETCORE_ENVIRONMENT: Local 
        DOTNET_RUNNING_IN_CONTAINER: "true"
        ASPNETCORE_URLS: "http://+:5001" 

        OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-lgtm:4317"

        Elasticsearch__Uri: https://my-elasticsearch-project-fdc740.es.us-east-1.aws.elastic.cloud/
        Elasticsearch__ApiKey: YzZhMU9Kc0I2V1U3d24xODlRRy06dE5rNkZ5N2dmb1VUWXpidVNYUE1xdw==

        Serilog__MinimumLevel__Default: Warning
        Serilog__MinimumLevel__Override__Microsoft: Warning

        ConnectionStrings__DefaultConnection: "Host=postgres-db;Port=5432;Database=TechChallengeGame;Username=postgres;Password=TechChallenge2024@"

    #     AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    #     AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    #     AWS_REGION: ${AWS_REGION}
    ports:
      - "5001:5001"
    restart: on-failure
    depends_on:
      postgres-db:
        condition: service_healthy
      otel-lgtm:
        condition: service_started
      
  otel-lgtm:
    image: otel/opentelemetry-collector-contrib:0.90.0
    container_name: otel-lgtm
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otelcol-config.yaml:/etc/otelcol-contrib/config.yaml:ro 
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus Exporter

  # --- Observabilidade: Métricas ---
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  # --- Observabilidade: Logs ---
  loki:
    image: grafana/loki:latest
    container_name: loki
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  # --- Observabilidade: Traces ---
  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./observability/tempo-config.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"
      - "4319:4317" # Mapeei para 4319 para não conflitar com o otel-lgtm

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./grafana/provisioning/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./grafana/provisioning/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  postgres_data: