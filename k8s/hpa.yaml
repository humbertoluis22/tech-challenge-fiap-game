apiVersion: autoscaling/v2

kind: HorizontalPodAutoscaler

metadata:

  name: game-api-hpa

  namespace: tech-challenge-game

spec:

  scaleTargetRef:

    apiVersion: apps/v1

    kind: Deployment

    name: game-api       # Tem que bater com o nome no deployment.yaml

  minReplicas: 1         # Mínimo de pods

  maxReplicas: 3         # Teto máximo (para não explodir custos na nuvem)

  metrics:

  - type: Resource

    resource:

      name: cpu

      target:

        type: Utilization

        averageUtilization: 5 # Escalar se CPU passar de 50% do request