# Kong Ingress - Path-based Routing with Strip Path
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: games-api-ingress
  namespace: tech-challenge-game
  annotations:
    # Kong strip-path annotation - removes the prefix before forwarding
    konghq.com/strip-path: "true"
    # Kong plugins for this Ingress
    konghq.com/plugins: games-cors, games-correlation-id, games-rate-limiting
spec:
  # Use Kong Ingress Controller
  ingressClassName: kong
  rules:
  - host: tech-challenge-game.fcg-identity.com
    http:
      paths:
      # Games Service - External: /games/* -> Internal: /*
      - path: /games
        pathType: Prefix
        backend:
          service:
            name: game-api-service
            port:
              number: 80