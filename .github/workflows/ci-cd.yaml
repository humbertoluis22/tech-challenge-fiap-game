name: Tech Challenge Game - CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - observabilidade-mensageria-k8s
  workflow_dispatch:

env:
  ECR_REPOSITORY: tech-challenge-fiap-game
  EKS_CLUSTER_NAME: fcg-identity-cluster
  AWS_REGION: sa-east-1

jobs:
  build-and-deploy:
    name: Build and Deploy Tech Challenge Game
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore TechChallengeGame.sln

      - name: Build solution
        run: dotnet build TechChallengeGame.sln -c Release --no-restore

      - name: Run tests
        run: |
          cd src/TechChallengeGame.Tests/
          dotnet test --no-build --configuration Release --verbosity normal

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Configure Kubectl for EKS
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy to EKS
        run: |
          # Substituir placeholder da imagem no deployment
          sed -i 's|208452488125.dkr.ecr.sa-east-1.amazonaws.com/tech-challenge-fiap-game:latest|${{ steps.build-image.outputs.image }}|g' k8s/deployment.yaml
          
          # Aplicar manifests em ordem
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/postgres-pvc.yaml
          kubectl apply -f k8s/kong-plugins.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Verify Deployment
        run: |
          echo "🚀 Verificando status do deploy..."
          
          # Verificar status final
          echo "📊 Status dos recursos:"
          kubectl get pods -n tech-challenge-game -o wide
          kubectl get svc -n tech-challenge-game
          kubectl get ingress -n tech-challenge-game
          
          # Verificar logs se houver problemas
          echo "📝 Verificando logs da API:"
          kubectl logs -l app=game-api -n tech-challenge-game --tail=10 || true
          
          # Teste básico de conectividade via Kong Ingress Controller
          echo "🧪 Testando Kong Ingress Controller:"
          echo "URL: http://a62a576cdc3754592a5d8ef2add25436-9dc9a6ade9f9ca9f.elb.sa-east-1.amazonaws.com/games/health"
          echo "Host: tech-challenge-game.fcg-identity.com"
          
          echo "✅ Deploy concluído com sucesso!"