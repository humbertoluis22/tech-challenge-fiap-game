receivers:
  otlp:
    protocols:
      grpc:
      http:

exporters:
  debug: {}
  loki:
    endpoint: http://loki:3100/loki/api/v1/push

processors:
  batch: {}
  resourcedetection:
    detectors: [env, system, host, os]
service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [loki,debug]
