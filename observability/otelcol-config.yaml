receivers:
  otlp:
    protocols:
      grpc:
      http:
  hostmetrics:
    collection_interval: 5s
    scrapers:
      cpu:
      memory:
      disk:
      filesystem:
      network:
      load:
      
processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  resourcedetection:
    detectors: [env, system, host, os]
    
exporters:
  otlp/tempo:
    endpoint: "tempo:4317" 
    tls:
      insecure: true
  
  prometheus:
    endpoint: "0.0.0.0:8889"
    # namespace: "tech_challenge"

  loki:
    endpoint: http://loki:3100/loki/api/v1/push
  
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp, hostmetrics]
      processors: [batch]
      exporters: [prometheus, debug] 
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo,debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [loki, debug]